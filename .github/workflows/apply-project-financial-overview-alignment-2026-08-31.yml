name: Apply Project Financial Overview Alignment 2026-08-31

on:
  push:
    paths:
      - 'scripts/align-project-financial-overview-with-projects-2026-08-31.js'
      - '.github/workflows/apply-project-financial-overview-alignment-2026-08-31.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply alignment
        run: node scripts/align-project-financial-overview-with-projects-2026-08-31.js
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build
        run: npm run build
      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/visao-financeira/page.js src/components/charts/ProjectFinancialOverviewChart.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: alinhar visao financeira com projetos"
          git push origin main
