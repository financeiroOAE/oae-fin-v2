name: Apply NFES Note Receivable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/apply-nfes-note-receivable.js
      - .github/workflows/apply-nfes-note-receivable.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply NFES adjustment
        run: node scripts/apply-nfes-note-receivable.js
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/fluxo-caixa/page.js
          git commit -m "feat: separar valor da nota e valor a receber no NFES"
          git push origin HEAD:main
