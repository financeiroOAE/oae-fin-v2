name: Final UI Closeout 2026-08-25

on:
  push:
    branches:
      - main
    paths:
      - scripts/final-ui-closeout-2026-08-25.py
      - .github/workflows/final-ui-closeout-2026-08-25.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar fechamento visual
        run: python3 scripts/final-ui-closeout-2026-08-25.py
      - name: Commitar ajustes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/fluxo-caixa/page.js src/app/projetos/page.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nova."
            exit 0
          fi
          git commit -m "fix: padronizar rankings kpis e relatorio de projetos"
          git push origin HEAD:main
