name: Apply Card Help Only

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-card-help-only.js
      - .github/workflows/apply-card-help-only.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar correção
        run: node scripts/apply-card-help-only.js
      - name: Commitar mudanças
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/UiEnhancements.jsx src/app/ui-fixes.css
          git commit -m "ui: manter apenas ajuda discreta nos cards"
          git push origin main
