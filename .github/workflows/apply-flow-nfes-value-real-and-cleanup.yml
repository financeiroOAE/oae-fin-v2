name: Apply Flow NFES Value Real And Cleanup

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-flow-nfes-value-real-and-cleanup.js
      - .github/workflows/apply-flow-nfes-value-real-and-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar ajustes
        run: node scripts/apply-flow-nfes-value-real-and-cleanup.js
      - name: Commitar mudanças
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/fluxo-caixa/page.js
          git commit -m "fix: ajustar painel NFES e limpar leitura fixa do fluxo"
          git push origin main
