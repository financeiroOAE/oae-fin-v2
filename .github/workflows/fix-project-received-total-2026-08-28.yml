name: Fix Project Received Total 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-project-received-total-2026-08-28.js'
      - '.github/workflows/fix-project-received-total-2026-08-28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/oae_ci
      JWT_SECRET: ci_only_secret_for_build_validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply fix
        run: node scripts/fix-project-received-total-2026-08-28.js

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/projetos/page.js
          git commit -m "Corrige recebido liquido consolidado de projetos"
          git push origin main
