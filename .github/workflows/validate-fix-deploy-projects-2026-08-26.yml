name: Validate Projects Deploy Fix 2026-08-26

on:
  push:
    branches: [fix-deploy-projects-2026-08-26]
    paths:
      - scripts/fix-projects-final-2026-08-26.js
      - .github/workflows/validate-fix-deploy-projects-2026-08-26.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/oae_ci
      JWT_SECRET: ci_only_secret_for_build_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-deploy-projects-2026-08-26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar reparo
        run: node scripts/fix-projects-final-2026-08-26.js
      - name: Instalar dependencias
        run: npm ci
      - name: Gerar Prisma
        run: npx prisma generate
      - name: Validar build
        run: npm run build
      - name: Commitar codigo validado
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/projetos/page.js
          git commit -m "fix: remover referencia residual que quebrava deploy"
          git push origin HEAD:fix-deploy-projects-2026-08-26
