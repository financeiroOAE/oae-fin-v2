name: Apply Project Portfolio Status Filter 2026-08-31

on:
  push:
    branches: [main]
    paths:
      - scripts/add-project-portfolio-status-filter-2026-08-31.js
      - .github/workflows/apply-project-portfolio-status-filter-2026-08-31.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar filtro de status
        run: node scripts/add-project-portfolio-status-filter-2026-08-31.js
      - name: Validar build
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Commitar mudancas validadas
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/projetos/page.js
          git commit -m "feat: filtrar projetos por andamento e conclusao"
          git push origin main
