name: Fix Margin Explanation Weekly PCT PRV 2026-08-26

on:
  push:
    paths:
      - 'scripts/fix-margin-explanation-weekly-pct-prv-2026-08-26.js'
      - '.github/workflows/fix-margin-explanation-weekly-pct-prv-2026-08-26.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/oae_ci
      JWT_SECRET: ci_only_secret_for_build_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar ajustes
        run: node scripts/fix-margin-explanation-weekly-pct-prv-2026-08-26.js
      - name: Instalar dependencias
        run: npm ci
      - name: Gerar Prisma
        run: npx prisma generate
      - name: Validar build
        run: npm run build
      - name: Commitar mudancas validadas
        run: |
          if git diff --quiet -- src/app/visao-financeira/page.js src/app/fluxo-caixa/page.js; then
            echo "Sem alteracoes para commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/visao-financeira/page.js src/app/fluxo-caixa/page.js
          git commit -m "fix: ajustar explicacao da margem e remover PCT PRV do fluxo semanal"
          git push origin main
