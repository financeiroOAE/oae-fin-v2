name: Round 4 DRE Followup

on:
  push:
    branches:
      - fix-financial-revenue-retroactive-2026-08-25

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-financial-revenue-retroactive-2026-08-25
          fetch-depth: 0
      - name: Aplicar ajuste final
        run: python scripts/round4-dre-followup.py
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dre/page.js
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
          else
            git commit -m "fix: finalizar classificacao de itens fora da DRE"
            git push origin HEAD:fix-financial-revenue-retroactive-2026-08-25
          fi
