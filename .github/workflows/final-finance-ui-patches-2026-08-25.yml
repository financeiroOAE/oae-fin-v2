name: Final Finance UI Patches 2026-08-25

on:
  push:
    branches:
      - fix-finance-rules-2026-08-25
    paths:
      - scripts/final-finance-ui-patches-2026-08-25.js
      - .github/workflows/final-finance-ui-patches-2026-08-25.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-finance-rules-2026-08-25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar ajustes finais
        run: node scripts/final-finance-ui-patches-2026-08-25.js
      - name: Commitar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/visao-financeira/page.js src/app/fluxo-caixa/page.js
          if git diff --cached --quiet; then
            echo "Sem alteracoes para commit"
          else
            git commit -m "fix: finalizar rankings ativos e valores completos"
            git push origin fix-finance-rules-2026-08-25
          fi
