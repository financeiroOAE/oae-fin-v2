name: Fix Project Tax Percentage Faturado 2026-08-27

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-project-tax-percentage-faturado-2026-08-27.js
      - .github/workflows/fix-project-tax-percentage-faturado-2026-08-27.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/oae_ci
      JWT_SECRET: ci_only_secret_for_build_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply percentage patch
        run: node scripts/fix-project-tax-percentage-faturado-2026-08-27.js
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build
        run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/projetos/page.js
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Ajusta percentual de tributos sobre faturamento"
          git push origin main
