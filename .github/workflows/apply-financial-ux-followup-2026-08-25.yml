name: Apply Financial UX Follow-up 2026-08-25

on:
  push:
    branches: [feat-financial-ux-2026-08-25]
    paths:
      - scripts/apply-financial-ux-followup-2026-08-25.js
      - .github/workflows/apply-financial-ux-followup-2026-08-25.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-financial-ux-2026-08-25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar refinamentos
        run: node scripts/apply-financial-ux-followup-2026-08-25.js
      - name: Commitar mudanças
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/projetos/page.js src/app/visao-financeira/page.js src/app/fluxo-caixa/page.js
          git commit -m "fix: refinar classificacao das entradas financeiras"
          git push origin HEAD:feat-financial-ux-2026-08-25
