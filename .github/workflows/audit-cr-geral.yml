name: Auditoria CR_GERAL

on:
  push:
    branches: [main]
  schedule:
    # 20h20 UTC corresponde a 17h20 no horario de Brasilia (UTC-3),
    # depois da sincronizacao financeira oficial das 17h00.
    - cron: '20 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Auditar CR_GERAL x painel
        shell: bash
        run: |
          set -euo pipefail

          OIDC_RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=oae-fin-cr-audit")

          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "Falha ao obter token OIDC do GitHub Actions."
            exit 1
          fi

          RESPONSE=$(curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 15 \
            --max-time 240 \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            https://oae-fin-v2.onrender.com/api/sync/cron/audit-cr-geral)

          printf '%s\n' "$RESPONSE" | jq .

          printf '%s\n' "$RESPONSE" | jq -e '
            [
              .panelSimulation.delta.semAdm,
              .panelSimulation.delta.adm,
              .panelSimulation.delta.comAdm
            ]
            | map(abs)
            | max <= 0.10
          ' >/dev/null || {
            echo "Divergencia financeira detectada entre CR_GERAL e simulacao do painel."
            exit 1
          }

          if ! printf '%s\n' "$RESPONSE" | jq -e '
            [
              .panelSimulation.sourceAccountDelta.projetoVs80,
              .panelSimulation.sourceAccountDelta.administrativoVs20
            ]
            | map(abs)
            | max <= 0.02
          ' >/dev/null; then
            echo "::warning::A distribuicao das contas 1010101 e 1010107 diverge da regra gerencial (80/20 para projetos + receitas avulsas 100% ADM). Consulte sourceAccountDelta no resultado da auditoria."
          fi

          echo "Auditoria financeira concluida: total preservado e regra gerencial validada."
