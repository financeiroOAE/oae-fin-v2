name: Apply Reports Flow Fix

on:
  push:
    branches: [fix-reports-and-flow-days-2026-08-19]
    paths:
      - scripts/apply-reports-flow-fix.js
      - .github/workflows/apply-reports-flow-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-reports-and-flow-days-2026-08-19
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: node scripts/apply-reports-flow-fix.js
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/fluxo-caixa/page.js src/app/projetos/page.js
          git commit -m "fix: estruturar relatórios e exibir todos os dias do fluxo"
          git push origin HEAD:fix-reports-and-flow-days-2026-08-19

# Trigger de aplicação validado em 19/08/2026.
