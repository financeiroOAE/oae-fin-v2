name: Apply Column K Forecast Revenue 2026-08-31

on:
  push:
    branches: [main]
    paths:
      - 'scripts/use-column-k-for-all-forecast-revenue-2026-08-31.js'
      - '.github/workflows/apply-column-k-forecast-revenue-2026-08-31.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply column K forecast rule
        run: node scripts/use-column-k-for-all-forecast-revenue-2026-08-31.js

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/oae_ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/oae_ci
          JWT_SECRET: ci_only_secret_for_build_validation

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/financialSync.js src/lib/dreEngine.js src/app/api/sync/route.js src/lib/businessRules.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: usar coluna K em toda receita prevista"
            git push
          fi
