name: Apply Reports Flow Main

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-reports-flow-main.js

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: node scripts/apply-reports-flow-main.js
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/fluxo-caixa/page.js src/app/projetos/page.js
          git commit -m "fix: estruturar relatórios e exibir todos os dias do fluxo"
          git push origin HEAD:main
