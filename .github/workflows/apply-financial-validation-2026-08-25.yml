name: Apply Financial Validation 2026-08-25

on:
  push:
    branches:
      - fix-financial-validation-2026-08-25
    paths:
      - scripts/apply-financial-validation-2026-08-25.js

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-financial-validation-2026-08-25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar correcoes
        run: node scripts/apply-financial-validation-2026-08-25.js
      - name: Commitar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nova."
            exit 0
          fi
          git commit -m "fix: reconciliar projetos receitas tributos e layouts"
          git push origin HEAD:fix-financial-validation-2026-08-25
