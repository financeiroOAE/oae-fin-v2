name: Fix Financial Rules 2026-08-26

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-financial-rules-2026-08-26.js
      - .github/workflows/fix-financial-rules-2026-08-26.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar correcoes
        run: node scripts/fix-financial-rules-2026-08-26.js
      - name: Commitar mudancas
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/projetos/page.js src/lib/dreEngine.js
          git commit -m "fix: corrigir receita de projetos e receita bruta da DRE"
          git push origin main
