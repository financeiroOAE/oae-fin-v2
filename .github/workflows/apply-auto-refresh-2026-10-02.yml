name: Apply Auto Refresh 2026-10-02

on:
  push:
    branches:
      - fix-auto-refresh-20261002
    paths:
      - .github/workflows/apply-auto-refresh-2026-10-02.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-auto-refresh-20261002
          fetch-depth: 0
      - name: Aplicar correção
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/auto-refresh.patch
          git apply --check /tmp/auto-refresh.patch
          git apply /tmp/auto-refresh.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/page.js src/app/visao-financeira/page.js src/app/fluxo-caixa/page.js src/app/dre/page.js src/app/projetos/page.js src/app/atualizacao-dados/page.js
          git commit -m "fix: atualiza dados ao abrir ou recarregar paginas"
          git push origin fix-auto-refresh-20261002
          git rm .github/workflows/apply-auto-refresh-2026-10-02.yml
          git commit -m "chore: remover workflow temporario da atualizacao automatica"
          git push origin fix-auto-refresh-20261002
