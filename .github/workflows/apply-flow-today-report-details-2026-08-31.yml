name: Apply Flow Today Report Details 2026-08-31

on:
  push:
    branches: [main]
    paths:
      - scripts/add-flow-today-report-details-2026-08-31.js
      - .github/workflows/apply-flow-today-report-details-2026-08-31.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar ajuste
        run: node scripts/add-flow-today-report-details-2026-08-31.js
      - name: Instalar dependencias
        run: npm ci
      - name: Gerar Prisma Client
        run: npx prisma generate
      - name: Validar build
        run: npm run build
      - name: Commitar mudancas validadas
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/fluxo-caixa/page.js
          git commit -m "feat: incluir lancamentos do dia no relatorio de fluxo"
          git push origin main
