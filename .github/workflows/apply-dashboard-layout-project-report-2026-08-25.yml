name: Apply Dashboard Layout Project Report 2026-08-25

on:
  push:
    branches:
      - fix-dashboard-layout-project-report-2026-08-25

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-dashboard-layout-project-report-2026-08-25
          fetch-depth: 0
      - name: Aplicar ajustes
        run: python scripts/fix-dashboard-layout-project-report-2026-08-25.py
      - name: Commitar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/visao-financeira/page.js src/app/projetos/page.js src/contexts/ReportContext.js
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
          else
            git commit -m "fix: ajustar dashboards e excluir equipe do relatorio executivo"
            git push origin HEAD:fix-dashboard-layout-project-report-2026-08-25
          fi
