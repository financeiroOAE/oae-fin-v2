name: Update CR Title Split Rule 2026-08-31

on:
  push:
    branches: [main]
    paths:
      - scripts/update-cr-title-split-rule-2026-08-31.js
      - .github/workflows/update-cr-title-split-rule-2026-08-31.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar nova regra CR_GERAL
        run: node scripts/update-cr-title-split-rule-2026-08-31.js
      - name: Validar build
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Commitar mudancas validadas
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/businessRules.js src/lib/consolidation.js src/app/fluxo-caixa/page.js src/lib/financialSync.js src/app/api/sync/route.js
          git commit -m "feat: somar J por titulo e manter K como recebido liquido"
          git push origin main
