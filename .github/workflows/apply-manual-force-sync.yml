name: Apply Manual Force Sync

on:
  push:
    branches: [fix-manual-force-sync-2026-08-19]
    paths:
      - scripts/apply-manual-force-sync.js
      - .github/workflows/apply-manual-force-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-manual-force-sync-2026-08-19
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar correção
        run: node scripts/apply-manual-force-sync.js
      - name: Commitar mudanças
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.js src/app/visao-financeira/page.js src/app/fluxo-caixa/page.js src/app/projetos/page.js src/app/dre/page.js
          git commit -m "fix: forçar sincronização manual em todas as telas"
          git push origin HEAD:fix-manual-force-sync-2026-08-19
