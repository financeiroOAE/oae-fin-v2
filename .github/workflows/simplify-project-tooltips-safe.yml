name: Simplify Project Tooltips Safe

on:
  push:
    branches:
      - fix-visao-info-filters-entry-breakdown-2026-08-25

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-visao-info-filters-entry-breakdown-2026-08-25
          fetch-depth: 0
      - name: Aplicar ajustes
        run: python scripts/simplify-project-tooltips-safe.py
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/projetos/page.js
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
          else
            git commit -m "fix: simplificar tooltips de projetos com seguranca"
            git push origin HEAD:fix-visao-info-filters-entry-breakdown-2026-08-25
          fi
