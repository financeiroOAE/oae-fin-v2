name: Fix Project Name Source 2026-09-01

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-project-name-source-2026-09-01.js
      - .github/workflows/fix-project-name-source-2026-09-01.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/oae_ci
      JWT_SECRET: ci_only_secret_for_build_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar regra global dos nomes de projetos
        run: node scripts/fix-project-name-source-2026-09-01.js
      - name: Instalar dependencias
        run: npm ci
      - name: Gerar Prisma
        run: npx prisma generate
      - name: Validar build
        run: npm run build
      - name: Commitar mudanca validada
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/businessRules.js
          git commit -m "fix: priorizar nome do centro de custo nos projetos"
          git push origin main
